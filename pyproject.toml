[project]
name = "nexogenesis"
version = "0.15.0"
description = "Personal thought emergence harness"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "click>=8.0",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
nexogenesis = "nexogenesis.cli:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["nexogenesis*"] } }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
